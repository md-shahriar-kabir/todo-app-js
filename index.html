<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-center">

  <div class="w-full max-w-md bg-white p-6 rounded-xl shadow-lg">
    <h1 class="text-3xl font-bold text-center mb-6">📝 Todo App</h1>

    <div class="flex gap-2">
      <input
        id="todoInput"
        type="text"
        placeholder="Enter a task..."
        class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-1 focus:ring-blue-500"
      />

      <button
        onclick="addTodo()"
        class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg"
      >
        Add
      </button>
    </div>

    <ul id="todoList" class="mt-6 space-y-3"></ul>
  </div>

  <script src="script.js"></script>

</body>
</html>
